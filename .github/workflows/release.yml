name: Release (GitHub 自动更新)

# v3.5.4：在 GitHub 云端完成「打包 → 出包 → 发 Release」，避开本机上行带宽瓶颈
# （本机到 uploads.github.com 实测约 48 KB/s，95MB 需半小时以上；runner 走内网秒传）。
# 触发：手动 workflow_dispatch（可填更新说明），或推送 v* tag。
on:
  workflow_dispatch:
    inputs:
      note:
        description: '更新说明（显示在客户端更新弹窗与 Release 页面）'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    # runner 的 stdout 是 cp1252；测试脚本、build_v2.py、release.py 都会打印中文
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（与本机发布环境对齐）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "PySide6==6.10.0" "pyinstaller==6.16.0" pywin32

      - name: 发布前门禁（语法 + v2 单测 + v1.5 回归）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q app v2 tools
          python -m pytest v2/tests -q
          python tests/test_core.py

      - name: 打包（PyInstaller onedir + 兼容别名 exe）
        run: python build_v2.py

      - name: 冻结包自检
        working-directory: dist/订单管理工作台
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\订单管理工作台.exe --check
          .\ProductSuite_v2.2.exe --check
          .\订单管理工作台.exe --ui-check

      - name: 生成更新包与清单（zip + SHA256 + manifest.json）
        env:
          RELEASE_NOTE: ${{ github.event.inputs.note }}
        run: |
          $note = $env:RELEASE_NOTE
          if ([string]::IsNullOrWhiteSpace($note)) { $note = "GitHub Actions 自动发布 $($env:GITHUB_REF_NAME)" }
          python tools/release.py --skip-build --note $note

      - name: 发布 GitHub Release（资产名 ASCII，清单 zip 改绝对直链）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_github.py --repo ${{ github.repository }}

      - name: 回读发布结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = python -c "import sys;sys.path.insert(0,'.');from v2 import __version__;print('v'+__version__)"
          curl.exe -sS -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
